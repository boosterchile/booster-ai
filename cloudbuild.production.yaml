# Usar el SA github-deployer en lugar del compute default.
# Cuentas nuevas de GCP (post-mayo 2024) ya no dan Editor automático al compute
# SA, por lo que este explicit assignment es requerido.
serviceAccount: projects/booster-ai-494222/serviceAccounts/github-deployer@booster-ai-494222.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

  # Trivy IaC #17, #30: workers viven en VPC peering interno con acceso
  # autorizado al GKE master (master_authorized_networks). Reemplaza el
  # default pool de IPs ephemeras de Google que requeria 0.0.0.0/0.
  #
  # Resource name: projects/PROJECT/locations/REGION/workerPools/POOL_NAME.
  # Ver `terraform output cloudbuild_worker_pool_name` post-apply.
  #
  # machineType es ignorado cuando se usa pool.name — los workers del pool
  # tienen su propio machine_type (e2-standard-2) configurado en
  # infrastructure/cloudbuild.tf > google_cloudbuild_worker_pool.production.
  pool:
    name: projects/booster-ai-494222/locations/southamerica-west1/workerPools/booster-production-pool

# Timeout global del build. Camino crítico (topes de step, no la suma de
# los que corren en paralelo). Las 9 imágenes salen juntas (waitFor: ['-']);
# el costo es el build más lento, no 9 veces.
#
# El release de #793 (Cloud Build c11b1702) murió por TIMEOUT dentro de
# canary-sleep: unos 30 min de build y deploys más la ventana de 1800 s no
# entran en 3600 s, y canary-verify no arrancó. El ~660 s de aca4641f
# (2026-06-16) ya no describe ese tramo. La ventana sigue en 1800 s: el piso
# de 30 se observa en esos 30 min, y bajo 5400 s entra junto con el tramo
# observado. No se acorta.
#
#   hasta route-canary    2100 s   reserva; c11b1702 observó ~1800 s (~30 min)
#   canary-sleep          2100 s   ventana 1800 + 300 de gcloud/kubectl
#   canary-verify          480 s   Monitoring y revertir (3 intentos, backoff
#                                  2 s y 4 s, cada gcloud a 30 s)
#   deploy-api + gke +     240 s
#   smoke
#   suma                  4920 s   margen 480 s bajo este tope de 5400 s
#
# No subir canary-sleep ni canary-verify sin rehacer esta cuenta.
timeout: 5400s
