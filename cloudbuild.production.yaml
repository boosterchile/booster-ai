# Cloud Build pipeline — production
#
# Triggered desde GitHub Actions release.yml tras manual approval en el environment
# `production`. El deploy de apps/api usa canary: despliega la nueva revisión
# con tag canary-signup-<sha> al 1% del tráfico, observa 30 min y en esa
# ventana manda GET de health al tag (step canary-sleep) + verifica
# error_rate/p95 (canary-verify) y recién entonces
# promueve a 100% (step deploy-api: update-traffic --to-latest). Ver T13
# SEC-001 más abajo (~línea 154) y el runbook docs/qa/signup-canary-rollback.md.
# El timeout global debe cubrir el sleep de 30 min — ver `timeout` al final.
#
# Scope:
#   - Build + deploy de apps/api, apps/whatsapp-bot, apps/web (PWA),
#     apps/telemetry-tcp-gateway (GKE), apps/telemetry-processor,
#     apps/sms-fallback-gateway.
#   - apps/document-service (worker TED, consumer de `document.uploaded`;
#     T10-21, ADR-083; pull o push según ADR-085).
#   - apps/notification-service (canal WhatsApp extraído; consumer de
#     `notification-events`. T10-21, ADR-083).
#   - apps/matching-engine (POST /ranking, ranking de matching; T10-21,
#     ADR-083).
#   - apps/marketing queda con imagen placeholder hasta que el directorio
#     exista (no hay source).
#
# apps/web requiere VITE_* substitutions (las claves Firebase web son
# públicas por diseño — viajan en el bundle al cliente). Setear via
# --substitutions en gcloud builds submit, o defaults aquí abajo.

steps:
  # =========================================================================
  # Build images en paralelo
  # =========================================================================
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - --file=apps/api/Dockerfile
      - --tag=${_REGISTRY}/api:${_COMMIT_SHA}
      - --tag=${_REGISTRY}/api:latest
      - .
    waitFor: ['-']

  - id: build-whatsapp-bot
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - --file=apps/whatsapp-bot/Dockerfile
      - --tag=${_REGISTRY}/whatsapp-bot:${_COMMIT_SHA}
      - --tag=${_REGISTRY}/whatsapp-bot:latest
      - .
    waitFor: ['-']

  # apps/web — PWA Vite. Las VITE_* env vars se inyectan a build-time
  # como --build-arg porque Vite las reemplaza textualmente en el bundle.
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - --file=apps/web/Dockerfile
      - --build-arg=VITE_API_URL=${_VITE_API_URL}
      - --build-arg=VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}
      - --build-arg=VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}
      - --build-arg=VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}
      - --build-arg=VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}
      - --build-arg=VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg=VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}
      - --build-arg=VITE_GOOGLE_MAPS_API_KEY=${_VITE_GOOGLE_MAPS_API_KEY}
      - --build-arg=VITE_RECAPTCHA_SITE_KEY=${_VITE_RECAPTCHA_SITE_KEY}
      # ADR-074 — sink de errores client-side. DSN público (misma categoría
      # que las keys Firebase de arriba); release = commit para correlar
      # issue ↔ deploy. DSN vacío = sink deshabilitado (build idéntico al actual).
      - --build-arg=VITE_SENTRY_DSN=${_VITE_SENTRY_DSN}
      - --build-arg=VITE_RELEASE=${_COMMIT_SHA}
      - --tag=${_REGISTRY}/web:${_COMMIT_SHA}
      - --tag=${_REGISTRY}/web:latest
      - .
    waitFor: ['-']

  # ADR-074 — token para subir sourcemaps a Sentry. SOFT-GATED: si el secret
  # `sentry-auth-token` no existe (o el SA no puede leerlo), deja el archivo
  # vacío y el paso de upload se salta — el deploy NO cambia. Crear el secret
  # (consola/Terraform, PO) activa la subida sin tocar este archivo.
  - id: fetch-sentry-token
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        gcloud secrets versions access latest --secret=sentry-auth-token \
          > /workspace/.sentry-token 2>/dev/null \
          || { echo "[sourcemaps] sentry-auth-token no disponible — upload se saltará"; : > /workspace/.sentry-token; }
    waitFor: ['-']

  # ADR-074 — upload de sourcemaps del web a Sentry (org booster-chile,
  # proyecto javascript-react). Los .map viven SOLO en la stage `build` del
  # Dockerfile (apartados del runtime image); se extraen reusando el layer
  # cache del build-web. Sin token o sin DSN: skip explícito, exit 0.
  - id: upload-sourcemaps-web
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        TOKEN=$$(cat /workspace/.sentry-token)
        if [ -z "$$TOKEN" ] || [ -z "${_VITE_SENTRY_DSN}" ]; then
          echo "[sourcemaps] skip (token o DSN ausente) — deploy sigue idéntico"
          exit 0
        fi
        docker build --file=apps/web/Dockerfile --target=build \
          --build-arg=VITE_API_URL=${_VITE_API_URL} \
          --build-arg=VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY} \
          --build-arg=VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN} \
          --build-arg=VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID} \
          --build-arg=VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET} \
          --build-arg=VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID} \
          --build-arg=VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID} \
          --build-arg=VITE_GOOGLE_MAPS_API_KEY=${_VITE_GOOGLE_MAPS_API_KEY} \
          --build-arg=VITE_RECAPTCHA_SITE_KEY=${_VITE_RECAPTCHA_SITE_KEY} \
          --build-arg=VITE_SENTRY_DSN=${_VITE_SENTRY_DSN} \
          --build-arg=VITE_RELEASE=${_COMMIT_SHA} \
          -t web-build-stage .
        docker create --name webbuild web-build-stage
        docker cp webbuild:/app/sourcemaps ./sourcemaps-web
        docker cp webbuild:/app/apps/web/dist ./dist-web
        docker rm webbuild
        docker run --rm -v /workspace:/work -e SENTRY_AUTH_TOKEN="$$TOKEN" \
          getsentry/sentry-cli:2 \
          sourcemaps upload --org=booster-chile --project=javascript-react \
          --release=${_COMMIT_SHA} --url-prefix='~/assets' \
          /work/sourcemaps-web /work/dist-web/assets
    waitFor: ['build-web', 'fetch-sentry-token']

  # apps/telemetry-tcp-gateway — TCP server para devices Teltonika.
  # Va a GKE Autopilot (no Cloud Run; el deploy es kubectl set image).
  - id: build-telemetry-tcp-gateway
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - --file=apps/telemetry-tcp-gateway/Dockerfile
      - --tag=${_REGISTRY}/telemetry-tcp-gateway:${_COMMIT_SHA}
      - --tag=${_REGISTRY}/telemetry-tcp-gateway:latest
      # :bootstrap es el tag inicial en infrastructure/k8s/telemetry-tcp-gateway*.yaml
      # para satisfacer Trivy AVD-KSV-0013 (no :latest). Cloud Build hace
      # kubectl set image al SHA real post-deploy.
      - --tag=${_REGISTRY}/telemetry-tcp-gateway:bootstrap
      - .
    waitFor: ['-']

  # apps/telemetry-processor — consumer Pub/Sub. Cloud Run.
  - id: build-telemetry-processor
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - --file=apps/telemetry-processor/Dockerfile
      - --tag=${_REGISTRY}/telemetry-processor:${_COMMIT_SHA}
      - --tag=${_REGISTRY}/telemetry-processor:latest
      - .
    waitFor: ['-']

  # apps/sms-fallback-gateway — Cloud Run webhook receiver para SMS Twilio.
  - id: build-sms-fallback-gateway
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - --file=apps/sms-fallback-gateway/Dockerfile
      - --tag=${_REGISTRY}/sms-fallback-gateway:${_COMMIT_SHA}
      - --tag=${_REGISTRY}/sms-fallback-gateway:latest
      - .
    waitFor: ['-']

  # apps/document-service — worker TED (consumer Pub/Sub pull). T10-21.
  - id: build-document-service
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - --file=apps/document-service/Dockerfile
      - --tag=${_REGISTRY}/document-service:${_COMMIT_SHA}
      - --tag=${_REGISTRY}/document-service:latest
      - .
    waitFor: ['-']

  # apps/notification-service — consumer Pub/Sub pull (canal WhatsApp). T10-21.
  - id: build-notification-service
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - --file=apps/notification-service/Dockerfile
      - --tag=${_REGISTRY}/notification-service:${_COMMIT_SHA}
      - --tag=${_REGISTRY}/notification-service:latest
      - .
    waitFor: ['-']

  # apps/matching-engine — POST /ranking (cómputo puro). T10-21.
  - id: build-matching-engine
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - --file=apps/matching-engine/Dockerfile
      - --tag=${_REGISTRY}/matching-engine:${_COMMIT_SHA}
      - --tag=${_REGISTRY}/matching-engine:latest
      - .
    waitFor: ['-']

  # =========================================================================
  # Push a Artifact Registry
  # =========================================================================
  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: [push, '--all-tags', '${_REGISTRY}/api']
    waitFor: [build-api]

  - id: push-whatsapp-bot
    name: gcr.io/cloud-builders/docker
    args: [push, '--all-tags', '${_REGISTRY}/whatsapp-bot']
    waitFor: [build-whatsapp-bot]

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: [push, '--all-tags', '${_REGISTRY}/web']
    waitFor: [build-web]

  - id: push-telemetry-tcp-gateway
    name: gcr.io/cloud-builders/docker
    args: [push, '--all-tags', '${_REGISTRY}/telemetry-tcp-gateway']
    waitFor: [build-telemetry-tcp-gateway]

  - id: push-telemetry-processor
    name: gcr.io/cloud-builders/docker
    args: [push, '--all-tags', '${_REGISTRY}/telemetry-processor']
    waitFor: [build-telemetry-processor]

  - id: push-sms-fallback-gateway
    name: gcr.io/cloud-builders/docker
    args: [push, '--all-tags', '${_REGISTRY}/sms-fallback-gateway']
    waitFor: [build-sms-fallback-gateway]

  - id: push-document-service
    name: gcr.io/cloud-builders/docker
    args: [push, '--all-tags', '${_REGISTRY}/document-service']
    waitFor: [build-document-service]

  - id: push-notification-service
    name: gcr.io/cloud-builders/docker
    args: [push, '--all-tags', '${_REGISTRY}/notification-service']
    waitFor: [build-notification-service]

  - id: push-matching-engine
    name: gcr.io/cloud-builders/docker
    args: [push, '--all-tags', '${_REGISTRY}/matching-engine']
    waitFor: [build-matching-engine]

  # =========================================================================
  # Deploy a Cloud Run — reemplaza placeholder gcr.io/cloudrun/placeholder
  #
  # Usamos `services update --image` (no `run deploy`) porque Terraform es
  # el owner único de la config Cloud Run: env vars, secrets, service
  # account, scaling, VPC connector, etc. `gcloud run deploy` sin flags
  # pisa TODA la config y deja el service sin secrets → el bot revienta
  # validando TWILIO_AUTH_TOKEN al startup (env validation con zod).
  # `services update --image` sólo cambia la imagen y preserva el resto.
  # =========================================================================
  # =========================================================================
  # T13 SEC-001 Sprint 2b (sec-001-cierre §3 H1.2 SC-1.2.3 + ADR-052) —
  # Canary deploy 1% traffic 30min antes de full deploy.
  #
  # Reemplaza el step monolítico `deploy-api` con una secuencia de 6 steps
  # que: (1) deploya la nueva revision con tag canary-signup-<sha> SIN
  # traffic; (2) rutea 1% del traffic al tag; (3) espera 30min observando;
  # (4) verifica error_rate < 1% AND p95_latency < 500ms via Cloud
  # Monitoring API; (5) promueve la revision a 100% traffic (PRESERVE id:
  # deploy-api para downstream `waitFor: [deploy-api, deploy-whatsapp-bot]`
  # de watch-deploy step ~298); (6) rollback fast-path comentado.
  #
  # Pre-req IaC: infrastructure/modules/cloud-run-service/main.tf añade
  # `traffic` a lifecycle.ignore_changes cuando var.traffic_managed_externally
  # = true (set en compute.tf SOLO para service_api). Sin ese ignore, el
  # próximo `terraform apply` revierte el split y mata el canary.
  #
  # Runbook detallado: docs/qa/signup-canary-rollback.md
  # =========================================================================

  # T13-fix (2026-05-28): step uses `entrypoint: bash` (was `gcloud`) so the
  # short SHA can be derived inline from `${_COMMIT_SHA}` without an extra
  # Cloud Build substitution + release.yml change. Cloud Run requires the
  # combined traffic tag + service name ≤ 46 chars; `booster-ai-api` (14) +
  # `canary-signup-` (14) + 12-char short SHA = 40 chars, 6-char headroom.
  #
  # T10-06 (ADR-082): la revisión se crea SIN `--tag` y se etiqueta después
  # con `update-traffic --update-tags`. Con `--tag`, `gcloud run services
  # update` genera el nombre de la revisión del lado del cliente y lo deja en
  # `template.revision`; Terraform lo declara vacío y el Drift Check quedaba
  # en rojo con `revision "booster-ai-api-NNNNN-xxx" -> null` tras cada
  # release. Sin `--tag` gcloud usa un nonce y Cloud Run nombra la revisión
  # (`surface/run/services/update.py`, `generate_name`). `update-traffic` solo
  # toca el bloque de traffic, que Terraform ya ignora para el api.
  #
  # La revisión nueva se verifica por digest. Cloud Run fija cada revisión al
  # digest de la imagen, así que `spec.containers[0].image` llega como
  # `api@sha256:…`, sin el tag del commit. El primer release con la guarda
  # (run 38250737682, 2026-10-12) abortó aquí con la revisión sana. Se acepta
  # el tag del commit o el digest que Artifact Registry da para
  # `api:${_COMMIT_SHA}`; cualquier otra imagen sigue abortando.
  - id: deploy-canary
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        FULL_SHA='${_COMMIT_SHA}'
        SHORT_SHA="$${FULL_SHA:0:12}"
        gcloud run services update booster-ai-api \
          --image=${_REGISTRY}/api:${_COMMIT_SHA} \
          --region=${_REGION} \
          --platform=managed \
          --no-traffic \
          --update-labels=commit=${_COMMIT_SHA}
        REV=$(gcloud run services describe booster-ai-api \
          --region=${_REGION} --platform=managed \
          --format='value(status.latestCreatedRevisionName)')
        if [ -z "$${REV}" ]; then
          echo "deploy-canary: sin latestCreatedRevisionName tras el update" >&2
          exit 1
        fi
        IMAGE=$(gcloud run revisions describe "$${REV}" \
          --region=${_REGION} --platform=managed \
          --format='value(spec.containers[0].image)')
        DIGEST=$(gcloud artifacts docker images describe \
          "${_REGISTRY}/api:${_COMMIT_SHA}" \
          --format='value(image_summary.digest)')
        if [ -z "$${DIGEST}" ]; then
          echo "deploy-canary: sin digest para api:${_COMMIT_SHA} en Artifact Registry" >&2
          exit 1
        fi
        case "$${IMAGE}" in
          *":${_COMMIT_SHA}" | *"@$${DIGEST}") ;;
          *)
            echo "deploy-canary: $${REV} corre $${IMAGE}, no api:${_COMMIT_SHA} ($${DIGEST})" >&2
            exit 1
            ;;
        esac
        gcloud run services update-traffic booster-ai-api \
          --region=${_REGION} \
          --platform=managed \
          --update-tags=canary-signup-$${SHORT_SHA}=$${REV}
    waitFor: [push-api]

  - id: route-canary
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    # Rutea 1% del traffic al tag canary-signup-<sha-12>. El resto (99%)
    # permanece en la revision LATEST que estaba antes del deploy. Cloud
    # Run accepta `--to-tags=<tag>=<weight>` donde weight es el porcentaje
    # (0-100). Si la sintaxis cambia entre versiones gcloud, validar con
    # `gcloud run services update-traffic --help`.
    # T13-fix (2026-05-28): same inline short-SHA derivation as deploy-canary.
    args:
      - -c
      - |
        set -e
        FULL_SHA='${_COMMIT_SHA}'
        SHORT_SHA="$${FULL_SHA:0:12}"
        gcloud run services update-traffic booster-ai-api \
          --region=${_REGION} \
          --platform=managed \
          --to-tags=canary-signup-$${SHORT_SHA}=1
    waitFor: [deploy-canary]

  - id: canary-sleep
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    # La ventana es 1800s. Los 300s de más cubren gcloud (timeout 30) y
    # kubectl (--request-timeout=20s). Si algo se cuelga, el step se corta.
    timeout: 2100s
    env:
      - USE_GKE_GCLOUD_AUTH_PLUGIN=True
    # 30 minutos observando el canary al 1%. En esa ventana se mandan GET de
    # solo lectura al URL del tag: _CANARY_MIN_REQUESTS más cinco (/health y
    # /health/signup-flow: sin body, sin auth, sin datos de usuarios). El piso
    # sigue en 30. El ingress del api es INTERNAL_LOAD_BALANCER.
    # Camino directo: 404 de ingress; el Job es el camino que llega. El worker
    # de booster-production-pool tiene IP externa (no_external_ip=false) y
    # vive en el peering servicenetworking booster-cloudbuild-pool-range, no
    # en la subnet booster-ai-private, así que no tiene Private Google Access.
    # Reescribir el host a 199.36.153.8 en este step no enruta, y quitar la IP
    # externa es Terraform. El 404 es un GET y el step sale enseguida (exit 2);
    # no es el TIMEOUT del build. La misma sonda corre en un Job efímero de la
    # VPC (cluster booster-ai-telemetry, imagen del api fijada por digest). El
    # pod está en booster-ai-private y resuelve el host del tag a 199.36.153.8
    # (private.googleapis.com): el DNS público sale por Cloud NAT y el ingress
    # vuelve a responder 404. Los logs se leen en cuanto el Job termina, falla
    # o desaparece. El borrado es posterior, también si falló o el sondeo hizo
    # timeout. Si ya no existe al leer, el gate no promueve. El resultado
    # queda en /workspace/canary-probe.json
    # (5xx, timeouts y errores de conexión). El tiempo que sobre se espera
    # para completar los 30 min. signup_probe sigue cada 60s; si falla 2 veces
    # seguidas, page y un humano decide rollback. error_rate y p95 los evalúa
    # canary-verify, con el piso en 30. El p95 queda dominado por /health.
    args:
      - -c
      - |
        set -euo pipefail
        START=$$(date +%s)
        WINDOW=1800
        FULL_SHA='${_COMMIT_SHA}'
        SHORT_SHA="$${FULL_SHA:0:12}"
        REVISION_TAG="canary-signup-$${SHORT_SHA}"
        MIN_REQUESTS='${_CANARY_MIN_REQUESTS}'
        RESULT="/workspace/canary-probe.json"
        JOB="canary-probe-$${SHORT_SHA}"
        echo "canary-probe: tag=$$REVISION_TAG min_requests=$$MIN_REQUESTS ventana=$${WINDOW}s"
        DIGEST="$$(timeout -k 5 30 gcloud artifacts docker images describe \
          "${_REGISTRY}/api:${_COMMIT_SHA}" \
          --format='value(image_summary.digest)' || true)"
        IMAGE=""
        if [ -n "$$DIGEST" ]; then
          IMAGE="${_REGISTRY}/api@$$DIGEST"
          echo "canary-probe: imagen=$$IMAGE"
        else
          echo "canary-probe: WARN sin digest; el Job no se crea con un tag movible"
        fi

        describe_with_retry() {
          for attempt in 1 2 3; do
            if OUT=$$(timeout -k 5 30 gcloud run services describe booster-ai-api \
              --region='${_REGION}' --platform=managed --format=json); then
              printf '%s' "$$OUT"
              return 0
            fi
            echo "canary-probe: describe intento $$attempt falló, reintentando..." >&2
            sleep 10
          done
          return 1
        }
        DESCRIBE="$$(describe_with_retry || true)"
        URL=""
        if [ -n "$$DESCRIBE" ]; then
          URL="$$(printf '%s' "$$DESCRIBE" | python3 scripts/deploy/canary_synthetic_probe.py --print-tag-url --tag "$$REVISION_TAG")"
        fi
        if [ -z "$$URL" ]; then
          echo "canary-probe: WARN sin URL de tag — no hay sonda; canary-verify decidirá con el tráfico real"
        else
          echo "canary-probe: url=$$URL"
          set +e
          python3 scripts/deploy/canary_synthetic_probe.py \
            --url "$$URL" \
            --tag "$$REVISION_TAG" \
            --min-requests "$$MIN_REQUESTS" \
            --window-seconds "$$WINDOW" \
            --margin-seconds 180 \
            --started-at "$$START" \
            --result-out "$$RESULT" \
            --manifest-out /tmp/canary-probe-job.json \
            --image "$$IMAGE" \
            --job-name "$$JOB"
          CODE=$$?
          set -e
          if [ "$$CODE" -eq 2 ] && [ -f /tmp/canary-probe-job.json ]; then
            echo "canary-probe: el worker no llega al tag. Sonda desde un Job en la VPC."
            TERMINAL=""
            BORRAR=0
            : > /tmp/canary-probe-job.log
            if timeout -k 5 30 gcloud container clusters get-credentials booster-ai-telemetry \
              --region='${_REGION}' --project=$PROJECT_ID --dns-endpoint; then
              kubectl --request-timeout=20s delete job "$$JOB" -n default --ignore-not-found || true
              if kubectl --request-timeout=20s apply -f /tmp/canary-probe-job.json; then
                BORRAR=1
                # Un Job Failed no cumple Complete. Esperar solo eso llega al
                # timeout y el TTL ya borró el objeto: kubectl logs responde
                # NotFound. Se corta en Complete, Failed o NotFound.
                LIMITE=$$(( START + WINDOW - 45 ))
                while [ "$$(date +%s)" -lt "$$LIMITE" ]; do
                  if JSON=$$(kubectl --request-timeout=20s get job "$$JOB" -n default -o json 2>/tmp/canary-probe-get.err); then
                    TERMINAL=$$(printf '%s' "$$JSON" | python3 scripts/deploy/canary_synthetic_probe.py --estado-job)
                  elif grep -q NotFound /tmp/canary-probe-get.err; then
                    TERMINAL="ausente"
                  else
                    TERMINAL="pendiente"
                    echo "canary-probe: no se pudo leer el estado del job, reintento" >&2
                  fi
                  if [ "$$TERMINAL" = "completo" ] || [ "$$TERMINAL" = "fallido" ] || [ "$$TERMINAL" = "ausente" ]; then
                    break
                  fi
                  sleep 5
                done
                echo "canary-probe: job=$$JOB namespace=default estado=$$TERMINAL"
                if [ "$$TERMINAL" != "ausente" ]; then
                  kubectl --request-timeout=20s logs "job/$$JOB" -n default > /tmp/canary-probe-job.log || true
                fi
              else
                echo "canary-probe: no se pudo crear el job"
                TERMINAL="no_creado"
              fi
            else
              echo "canary-probe: no se pudo tomar credenciales del cluster"
              TERMINAL="sin_credenciales"
            fi
            tail -n 3 /tmp/canary-probe-job.log || true
            # El conteo por línea solo si TERMINAL=completo. Failed o
            # pendiente no promueven aunque haya 200 en el log. El pod lleva
            # safe-to-evict=false para que el autoscaler no lo mate antes
            # del resumen. Un 404 en ese conteo, o un 5xx, sigue siendo fallo.
            if [ -s /tmp/canary-probe-job.log ]; then
              python3 scripts/deploy/canary_synthetic_probe.py \
                --aplicar-log-job "$$RESULT" \
                --log-file /tmp/canary-probe-job.log \
                --job-estado "$$TERMINAL"
            elif [ "$$TERMINAL" = "ausente" ]; then
              echo "canary-probe: el job desapareció antes de leer logs — no se promueve"
              python3 scripts/deploy/canary_synthetic_probe.py \
                --marcar-job "$$RESULT" \
                --job-estado perdido
            else
              echo "canary-probe: sin resumen (estado=$$TERMINAL) — no se promueve"
              python3 scripts/deploy/canary_synthetic_probe.py \
                --marcar-job "$$RESULT" \
                --job-estado fallo
            fi
            if [ "$$BORRAR" = "1" ]; then
              echo "canary-probe: borrando el job despues de guardar logs (estado=$$TERMINAL)"
              kubectl --request-timeout=20s delete job "$$JOB" -n default --ignore-not-found || true
            fi
          elif [ "$$CODE" -eq 2 ]; then
            python3 scripts/deploy/canary_synthetic_probe.py \
              --marcar-job "$$RESULT" \
              --job-estado fallo
          elif [ "$$CODE" -ne 0 ]; then
            echo "canary-probe: WARN sonda directa salió $$CODE"
            python3 scripts/deploy/canary_synthetic_probe.py \
              --marcar-job "$$RESULT" \
              --job-estado fallo
          fi
        fi
        ELAPSED=$$(( $$(date +%s) - START ))
        REST=$$(( WINDOW - ELAPSED ))
        if [ "$$REST" -gt 0 ]; then
          echo "canary-probe: esperando $${REST}s para completar la ventana de $${WINDOW}s"
          sleep "$$REST"
        fi
    waitFor: [route-canary]

  - id: canary-verify
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    # 480s: token 30s, hasta 4 lecturas de Monitoring (30s, 20s entre ellas)
    # y el revertir. Describe y cada update-traffic van a 30s, 3 intentos,
    # backoff 2s y 4s. El describe del revertir se presupuesta en un intento
    # (el del step acaba de funcionar) y los dos update-traffic en 3:
    # 30+180+30+192 = 432, margen 48s dentro del step. Si ese describe también
    # agota los 3 intentos, este tope puede cortar y el step sale distinto de
    # 0 (no promueve). La cuenta del build está en el timeout global, al final
    # del archivo. No subir este número sin rehacer esa cuenta.
    # El tope del build es 5400s.
    timeout: 480s
    # Query Cloud Monitoring API para verificar SLOs durante el canary
    # window:
    #   - error_rate < 1%: count(5xx requests) / count(total requests) <
    #     0.01 sobre los últimos 30min en la revision con tag
    #     canary-signup-<sha>.
    #   - p95_latency < 500ms: aligned p95 sobre request_latencies metric,
    #     mismo scope.
    #
    # Si error_rate o p95 fallan con el piso cubierto, exit 1 y Cloud Build
    # aborta antes de promover. Ese rollback de SLO lo hace el humano.
    #
    # La ventana (canary-sleep) manda GET de health al tag (piso + 5) y deja
    # el resultado en /workspace/canary-probe.json. Si la sonda llegó a la app
    # y vio 5xx, o timeouts y errores de conexión, o fallaron el camino
    # directo y el Job teniendo URL, este step sale distinto de 0. El p95 de
    # Monitoring queda dominado por /health (la sonda es casi toda la muestra
    # y ese handler no toca la base). Sin URL del tag, con el piso en 0, o
    # con Monitoring y la sonda bajo el piso, sale distinto de 0 y revierte
    # el tag (100 % a la revisión que no es el tag, y se quita el tag). Si
    # la sonda llegó y respuestas_app cubre el piso aunque Monitoring no, se
    # evalúan error rate y p95. La decisión vive en
    # scripts/deploy/canary_verify_decision.py.
    args:
      - -c
      - |
        set -euo pipefail
        # Check REAL contra Cloud Monitoring (2026-06-11; antes placeholder
        # exit 0 — auditoría 2026-06-09 riesgo alto: la promoción a 100% no
        # tenía gate automático). Si error_rate >= 1% o p95 >= 500ms Y la
        # muestra alcanza el piso → exit 1 y el build aborta SIN promover.
        # 5xx o errores de conexión de la sonda, directo y Job fallidos con
        # URL, o un Job que ya no existe al leer los logs, salen distinto de
        # 0 (el resultado está en canary-probe.json). No se promueve.
        # Sin URL del tag, piso en 0, muestra bajo el piso (Monitoring y
        # respuestas_app) o sin revision con tag: sale distinto de 0. Esos
        # casos, salvo el tag ausente, revierten el tag antes de salir. Si
        # la sonda cubre el piso, el p95 se evalúa aunque Monitoring vaya
        # atrás. El p95 queda dominado por /health.
        FULL_SHA='${_COMMIT_SHA}'
        SHORT_SHA="$${FULL_SHA:0:12}"
        REVISION_TAG="canary-signup-$${SHORT_SHA}"
        MIN_REQUESTS='${_CANARY_MIN_REQUESTS}'
        echo "canary-verify: tag=$$REVISION_TAG window=30min thresholds: error_rate<1%, p95<500ms, min_requests=$$MIN_REQUESTS"

        # Retry x3: un transitorio de gcloud/API no debe bloquear un deploy
        # legítimo (review 2026-06-11).
        describe_with_retry() {
          for attempt in 1 2 3; do
            if OUT=$$(timeout -k 5 30 gcloud run services describe booster-ai-api \
              --region='${_REGION}' --platform=managed --format=json); then
              echo "$$OUT"; return 0
            fi
            echo "canary-verify: describe intento $$attempt falló, reintentando..." >&2
            sleep 10
          done
          return 1
        }
        REVISION=$$(describe_with_retry \
          | python3 -c "import sys,json; s=json.load(sys.stdin); print(next((t.get('revisionName','') for t in s.get('status',{}).get('traffic',[]) if t.get('tag')=='$$REVISION_TAG'), ''))")
        if [ -z "$$REVISION" ]; then
          echo "canary-verify: FAIL no se encontró revision con tag $$REVISION_TAG — NO promover"
          exit 1
        fi
        echo "canary-verify: revision=$$REVISION"

        revertir_tag() {
          echo "canary-verify: revirtiendo el tag $$REVISION_TAG"
          DESC=""
          ok_describe=1
          for intento in 1 2 3; do
            if DESC="$$(timeout -k 5 30 gcloud run services describe booster-ai-api \
                --region='${_REGION}' --platform=managed --format=json)"; then
              ok_describe=0
              break
            fi
            echo "canary-verify: describe para revertir intento $$intento falló" >&2
            if [ "$$intento" -lt 3 ]; then
              sleep $$((2 ** intento))
            fi
          done
          if [ "$$ok_describe" != 0 ]; then
            echo "canary-verify: ALERTA revertir el tag falló tras 3 intentos de describe; el 1% puede quedar — NO promover"
            return 1
          fi
          export REVISION_TAG
          if ! ESTABLE="$$(printf '%s' "$$DESC" | python3 -c '
        import json, os, sys
        sys.path.insert(0, "scripts/deploy")
        from canary_verify_decision import resultado_reversion
        doc = json.load(sys.stdin)
        codigo, lineas = resultado_reversion(doc, os.environ["REVISION_TAG"])
        for linea in lineas:
            print(linea)
        raise SystemExit(codigo)
        ')"; then
            printf '%s\n' "$$ESTABLE"
            echo "canary-verify: ALERTA revertir el tag falló; el 1% puede quedar — NO promover"
            return 1
          fi
          echo "canary-verify: devolviendo 100% a $$ESTABLE y quitando $$REVISION_TAG"
          aplicar_trafico() {
            accion="$$1"
            shift
            for intento in 1 2 3; do
              if timeout -k 5 30 gcloud run services update-traffic booster-ai-api \
                  --region='${_REGION}' \
                  --platform=managed \
                  "$$@"; then
                return 0
              fi
              echo "canary-verify: update-traffic ($$accion) intento $$intento falló" >&2
              if [ "$$intento" -lt 3 ]; then
                sleep $$((2 ** intento))
              fi
            done
            echo "canary-verify: ALERTA revertir el tag falló tras 3 intentos de update-traffic ($$accion); el 1% puede quedar — NO promover"
            return 1
          }
          aplicar_trafico devolver --to-revisions="$$ESTABLE"=100 || return 1
          aplicar_trafico quitar --remove-tags="$$REVISION_TAG" || return 1
        }

        if ! TOKEN="$$(timeout -k 5 30 gcloud auth print-access-token)"; then
          echo "canary-verify: ALERTA no hubo token de Monitoring — NO promover"
          echo "canary-verify: REVERTIR_TAG"
          revertir_tag || exit 1
          exit 1
        fi
        export TOKEN REVISION MIN_REQUESTS
        set +e
        python3 <<'PYCHECK' | tee /tmp/canary-verify.out
        import json, os, sys, time, urllib.parse, urllib.request
        from datetime import datetime, timedelta, timezone

        def _gate_monitoring():
            project = '$PROJECT_ID'
            revision = os.environ['REVISION']
            token = os.environ['TOKEN']
            min_requests = int(os.environ.get('MIN_REQUESTS', '0') or '0')

            def ts(filter_, aligner, reducer, group_by=None):
                end = datetime.now(timezone.utc)
                start = end - timedelta(minutes=30)
                params = {
                    'filter': filter_,
                    'interval.startTime': start.strftime('%Y-%m-%dT%H:%M:%SZ'),
                    'interval.endTime': end.strftime('%Y-%m-%dT%H:%M:%SZ'),
                    'aggregation.alignmentPeriod': '1800s',
                    'aggregation.perSeriesAligner': aligner,
                    'aggregation.crossSeriesReducer': reducer,
                }
                qs = urllib.parse.urlencode(params)
                if group_by:
                    qs += ''.join(f'&aggregation.groupByFields={urllib.parse.quote(g)}' for g in group_by)
                req = urllib.request.Request(
                    f'https://monitoring.googleapis.com/v3/projects/{project}/timeSeries?{qs}',
                    headers={'Authorization': f'Bearer {token}'})
                with urllib.request.urlopen(req, timeout=30) as r:
                    return json.load(r).get('timeSeries', [])

            def leer_muestra():
                base = (f'metric.type="run.googleapis.com/request_count" '
                        f'AND resource.labels.service_name="booster-ai-api" '
                        f'AND resource.labels.revision_name="{revision}"')
                series = ts(base, 'ALIGN_SUM', 'REDUCE_SUM', ['metric.labels.response_code_class'])
                counts = {}
                for s_ in series:
                    klass = s_.get('metric', {}).get('labels', {}).get('response_code_class', '?')
                    for pt in s_.get('points', []):
                        v = pt.get('value', {})
                        counts[klass] = counts.get(klass, 0) + int(v.get('int64Value', v.get('doubleValue', 0)))
                total = sum(counts.values())
                # p95 de Monitoring solo si request_count ya cubre el piso.
                # Por debajo, el gate usa las latencias de la sonda.
                p95s = []
                if conviene_leer_p95(total, min_requests, llego, respuestas_app):
                    lat = (f'metric.type="run.googleapis.com/request_latencies" '
                           f'AND resource.labels.service_name="booster-ai-api" '
                           f'AND resource.labels.revision_name="{revision}"')
                    for s_ in ts(lat, 'ALIGN_PERCENTILE_95', 'REDUCE_MAX'):
                        for pt in s_.get('points', []):
                            v = pt.get('value', {})
                            p95s.append(float(v.get('doubleValue', v.get('int64Value', 0))))
                return total, counts, p95s

            sys.path.insert(0, 'scripts/deploy')
            from canary_verify_decision import decidir_canary, conviene_leer_p95, decidir_gate, decidir_resultado_sonda, leer_resultado_sonda, reintentos_de_muestra
            resultado, codigo_lectura, lineas_lectura = leer_resultado_sonda('/workspace/canary-probe.json')
            for linea in lineas_lectura:
                print(linea)
            if codigo_lectura != 0:
                sys.exit(codigo_lectura)
            codigo_sonda, lineas_sonda = decidir_resultado_sonda(resultado)
            for linea in lineas_sonda:
                print(linea)
            if codigo_sonda != 0:
                sys.exit(codigo_sonda)
            llego = isinstance(resultado, dict) and bool(resultado.get('llego_a_la_app'))
            respuestas_app = int(resultado.get('respuestas_app') or 0) if isinstance(resultado, dict) else 0
            total, counts, p95s = leer_muestra()
            for intento in range(1, 5):
                if not reintentos_de_muestra(total, min_requests, intento, 4):
                    break
                print(
                    f'canary-verify: muestra {total} < {min_requests} '
                    f'(intento {intento}/4), reintento en 20s por ingesta'
                )
                time.sleep(20)
                total, counts, p95s = leer_muestra()
            codigo, lineas = decidir_gate(resultado, total, min_requests, counts, p95s)
            for linea in lineas:
                print(linea)
            sys.exit(codigo)

        try:
            _gate_monitoring()
        except Exception as exc:
            print(
                'canary-verify: ALERTA Monitoring no se pudo leer '
                f'({type(exc).__name__}: {exc}) — NO promover'
            )
            print('canary-verify: REVERTIR_TAG')
            sys.exit(1)
        PYCHECK
        CODIGO="$${PIPESTATUS[0]}"
        set -e
        REVERT=0
        if grep -q 'REVERTIR_TAG' /tmp/canary-verify.out; then
          revertir_tag || REVERT=$$?
        fi
        if [ "$$REVERT" != 0 ]; then
          echo "canary-verify: ALERTA revertir el tag falló; el 1% puede quedar — NO promover"
          exit 1
        fi
        exit "$$CODIGO"
    waitFor: [canary-sleep]

  # PRESERVE id: deploy-api — downstream `waitFor: [deploy-api, deploy-
  # whatsapp-bot]` (step watch-deploy line ~298) depende de este id para
  # resolver. Cambiar el id rompe la pipeline. Per plan T13 round 2 P1-1 fix.
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    # Promueve la revisión a 100% (--to-latest) y luego limpia los tags
    # canary-signup-* viejos (cloud-run-canary-tag-cleanup, Opción A). El
    # update-traffic es la acción crítica (set -e → falla el deploy si falla).
    # La limpieza es FAIL-SAFE: corre POST-promoción (ningún canary tag sirve
    # tráfico ya), preserva el tag de ESTE deploy para auditoría, y si su parseo
    # falla solo loguea WARN (los tags siguen acumulando como hoy, no rompe el
    # deploy). Sin esto los tags crecen 1/deploy → quota a ~50 (hoy ~10).
    args:
      - -c
      - |
        set -e
        gcloud run services update-traffic booster-ai-api \
          --region=${_REGION} --platform=managed --to-latest
        FULL_SHA='${_COMMIT_SHA}'
        SHORT_SHA="$${FULL_SHA:0:12}"
        CURRENT="canary-signup-$${SHORT_SHA}"
        OLD=$(gcloud run services describe booster-ai-api --region=${_REGION} \
                --format='value(spec.traffic[].tag)' 2>/dev/null \
              | tr ';,' '\n' | grep '^canary-signup-' | grep -vx "$${CURRENT}" \
              | sort -u | paste -sd, -) || true
        if [ -n "$${OLD}" ]; then
          gcloud run services update-traffic booster-ai-api \
            --region=${_REGION} --platform=managed --remove-tags="$${OLD}" \
            || echo "WARN: cleanup de canary tags falló (no-bloqueante): $${OLD}"
        else
          echo "Sin canary tags viejos que limpiar."
        fi
    waitFor: [canary-verify]

  # =========================================================================
  # Rollback fast-path. Sin muestra, canary-verify ya revierte el tag
  # (100 % a la revisión que no es el tag, y --remove-tags) antes de salir
  # distinto de 0. Si ese gcloud falla, o el fallo es de SLO (5xx de la
  # sonda, error_rate, p95), o human-on-call aborta antes de los 30 min,
  # el comando manual sigue siendo:
  #
  #   gcloud run services update-traffic booster-ai-api \
  #     --region=southamerica-west1 \
  #     --platform=managed \
  #     --to-revisions=PREVIOUS=100
  #
  # Esto revierte instantáneamente a la revision anterior (pre-canary). El
  # tag canary-signup-<sha> queda sin traffic pero persiste — útil para
  # forensic post-mortem. Cleanup del tag: `gcloud run services
  # update-traffic --remove-tags=canary-signup-<sha>` después del incident
  # review.
  #
  # Decision criteria + escalation: docs/qa/signup-canary-rollback.md.
  # =========================================================================

  - id: deploy-whatsapp-bot
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - booster-ai-whatsapp-bot
      - --image=${_REGISTRY}/whatsapp-bot:${_COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --update-labels=commit=${_COMMIT_SHA}
    waitFor: [push-whatsapp-bot]

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - booster-ai-web
      - --image=${_REGISTRY}/web:${_COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --update-labels=commit=${_COMMIT_SHA}
    waitFor: [push-web]

  # apps/telemetry-processor — Cloud Run PULL consumer (StreamingPull).
  # min-instances=1 + no-cpu-throttling son OBLIGATORIOS para un consumer pull
  # (ver compute.tf / incidente 2026-06-07). Explícitos acá para idempotencia y
  # auto-documentación, aunque `update --image` ya preserva la config existente.
  - id: deploy-telemetry-processor
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - booster-ai-telemetry-processor
      - --image=${_REGISTRY}/telemetry-processor:${_COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=1
      - --no-cpu-throttling
      - --cpu=1
      - --memory=1Gi
      - --update-labels=commit=${_COMMIT_SHA}
    waitFor: [push-telemetry-processor]

  - id: deploy-sms-fallback-gateway
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - booster-ai-sms-fallback-gateway
      - --image=${_REGISTRY}/sms-fallback-gateway:${_COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --update-labels=commit=${_COMMIT_SHA}
    waitFor: [push-sms-fallback-gateway]

  # apps/document-service — consumer de `document.uploaded`, pull o push según
  # `var.document_service_push` (ADR-085). --min-instances y
  # --[no-]cpu-throttling NO van aquí: Terraform los fija junto con el modo
  # (pull: min=1 + CPU siempre asignada; push: min=0 + CPU solo en requests;
  # compute.tf `service_document`), y `services update` conserva el valor vivo
  # cuando no se le pasa. Fijarlos acá devolvía min=1 en cada release.
  # Rollback: `gcloud run services update-traffic booster-ai-document-service
  # --to-revisions=<anterior>=100` (docs/runbooks/rollback-drill-microservicios.md).
  - id: deploy-document-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - booster-ai-document-service
      - --image=${_REGISTRY}/document-service:${_COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --cpu=1
      - --memory=1Gi
      - --update-labels=commit=${_COMMIT_SHA}
    waitFor: [push-document-service]

  # apps/notification-service — Cloud Run PULL consumer de `notification-events`.
  # min-instances=1 + no-cpu-throttling obligatorios (consumer pull; ver
  # compute.tf `service_notification`). El tráfico real lo decide el flag
  # `notifications_via_microservice` del api, no este deploy.
  - id: deploy-notification-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - booster-ai-notification-service
      - --image=${_REGISTRY}/notification-service:${_COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=1
      - --no-cpu-throttling
      - --cpu=1
      - --memory=512Mi
      - --update-labels=commit=${_COMMIT_SHA}
    waitFor: [push-notification-service]
    # Tolerado hasta el `terraform apply` de T10-21 (issue #784). Sin el
    # apply, el servicio no tiene TWILIO_*: la imagen sale con exit 1 al
    # validar su config, la revisión no queda lista y `services update`
    # falla. Así el release sigue y el servicio queda en la revisión anterior.
    allowFailure: true

  # apps/matching-engine — request-driven (min-instances=1 contra cold start
  # en el camino síncrono del matching). El tráfico real lo deciden los flags
  # matching_shadow / matching_via_microservice del api, no este deploy. Sin
  # waitFor cruzado, el engine queda arriba antes que el api (que espera 30
  # min de canary): durante esa ventana, en modo microservicio el engine es la
  # fuente del algoritmo, y en sombra un cambio de algoritmo se ve como
  # divergencia transitoria (runbook service-matching-engine.md).
  - id: deploy-matching-engine
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - booster-ai-matching-engine
      - --image=${_REGISTRY}/matching-engine:${_COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=1
      - --cpu=1
      - --memory=512Mi
      - --update-labels=commit=${_COMMIT_SHA}
    waitFor: [push-matching-engine]
    # Tolerado hasta el `terraform apply` de T10-21 (issue #784). Sin el
    # apply, el servicio no tiene OIDC_AUDIENCE ni ALLOWED_CALLER_SA: la imagen
    # sale con exit 1 al validar su config y `services update` falla. Así el
    # release sigue y el servicio queda en la revisión anterior.
    allowFailure: true

  # apps/telemetry-tcp-gateway — GKE Autopilot. NO va a Cloud Run.
  #
  # ADR-065 (2026-06-16): deploy AUTOMÁTICO desde Cloud Build vía DNS endpoint
  # del control plane (ADR-059), reemplaza el stdout-only manual (audit P0-I).
  # El SA github-deployer (roles/container.developer) hace `kubectl set image`
  # al SHA buildeado y verifica el rollout, gateado por IAM — sin depender del
  # VPC peering (la NOTA stale 2026-05-09 era previa a ADR-059).
  #
  # Ordenamiento `waitFor: [deploy-api, ...]`: corre DESPUÉS de que el API se
  # promovió a 100%. Si el rollout del gateway falla, el build falla SIN poner
  # en riesgo el canary del API (que ya está a salvo). Fail-loud: un rollout
  # fallido o que no converge alerta al operador → no más drift silencioso.
  # Break-glass: scripts/deploy-telemetry-gateway.sh sigue disponible desde una
  # laptop autorizada si la ruta de Cloud Build falla.
  - id: gke-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    env:
      - USE_GKE_GCLOUD_AUTH_PLUGIN=True
    args:
      - -c
      - |
        set -euo pipefail
        gcloud container clusters get-credentials booster-ai-telemetry \
          --region=${_REGION} --project=$PROJECT_ID --dns-endpoint
        kubectl set image deployment/telemetry-tcp-gateway \
          gateway=${_REGISTRY}/telemetry-tcp-gateway:${_COMMIT_SHA} \
          -n telemetry
        kubectl rollout status deployment/telemetry-tcp-gateway \
          -n telemetry --timeout=300s
    waitFor: [deploy-api, push-telemetry-tcp-gateway]

  # =========================================================================
  # Smoke test — ping al webhook Twilio via la URL pública canonical.
  #
  # Apuntamos a https://api.boosterchile.com/webhooks/whatsapp porque eso
  # ejercita simultáneamente:
  #   - Cloud DNS resolviendo api.boosterchile.com
  #   - Cert managed (booster-ai-cert-*) ACTIVE
  #   - Global HTTPS LB con la url_map ruteando /webhooks/whatsapp* al
  #     backend del whatsapp-bot
  #   - Cloud Run del bot serving y validando firmas Twilio (devuelve 403
  #     porque no firmamos el request)
  #
  # Si cualquiera de esos eslabones se cae, el smoke falla y el deploy se
  # marca como inválido. Más útil que ping al *.run.app porque ese skip-ea
  # toda la cadena LB/cert/DNS.
  # =========================================================================
  - id: smoke-api-health
    name: gcr.io/cloud-builders/curl
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        # api.boosterchile.com — URL pública canónica post-DNS-migration.
        # Bash vars escapadas con dollar-dollar — Cloud Build interpreta una
        # variable bash sin escapar como substitution y rechaza el build.
        WEBHOOK_URL="https://${_PUBLIC_API_HOST}/webhooks/whatsapp"

        # POST sin firma debe devolver 403. Eso confirma que el bot está
        # serving y validando firmas Twilio + el LB ruteando + el cert ok.
        for i in 1 2 3 4 5; do
          status=$$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -X POST \
            "$$WEBHOOK_URL" -d "Body=test" || echo "000")
          if [ "$$status" = "403" ]; then
            echo "smoke OK: webhook returns 403 (expected — no signature)"
            exit 0
          fi
          echo "smoke retry $$i/5: expected 403, got $$status"
          sleep 15
        done
        echo "smoke test FAILED after 5 attempts (last status: $$status)"
        exit 1
    waitFor: [deploy-api, deploy-whatsapp-bot]

  # SEC-001 boundary-closure T10 (SC-G7) — la lane de deploy de la
  # auth-blocking function (build/deploy/verify gated por
  # _AUTH_BLOCKING_DEPLOY) se removió con el decomiso de la blocking
  # function (ADR-057 supersede ADR-054). El leg Google se cierra por el
  # boundary ADR-001 + harness CI default-deny + reaper, no por Cloud Function.

