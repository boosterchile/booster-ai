name: Security

# Escaneos de seguridad: secretos (gitleaks), vulnerabilidades de dependencias (npm audit),
# análisis estático (CodeQL). Ver references/security-checklist.md.
# Gates bloqueantes para evitar regresiones como SEC-2026-04-01 (Booster 2.0).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scheduled scan — Lunes 03:00 UTC (00:00 Chile)
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write  # Para subir SARIF a Security tab
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Gitleaks — escaneo de secretos en código + historial completo
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historial completo para scan profundo
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Config custom opcional en .gitleaks.toml

  # ---------------------------------------------------------------------------
  # npm audit — vulnerabilidades de dependencias
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm audit (HIGH+)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: '10.34.4'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit (HIGH+)
        run: |
          # Falla si hay vulnerabilidades HIGH o CRITICAL
          pnpm audit --audit-level=high --prod || {
            echo "::error::High/Critical vulnerabilities detected. Run 'pnpm audit' locally for details."
            echo "::notice::If unfixable, document en PR + issue con tracking."
            exit 1
          }

  # ---------------------------------------------------------------------------
  # CodeQL — análisis estático de JS/TS
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  # ---------------------------------------------------------------------------
  # Trivy — escaneo de Dockerfiles (filesystem + config misconfigurations)
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy filesystem + config scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          # En modo sarif la action hace `unset TRIVY_SEVERITY` e ignora el input
          # `severity`, así que el exit-code dispara con CUALQUIER severidad
          # (rompió un deploy con 5 MEDIUM). `true` respeta el `severity:
          # HIGH,CRITICAL` de arriba → el gate solo falla en HIGH/CRITICAL.
          # Trade-off: el Security tab (trivy-fs) solo mostrará HIGH/CRITICAL.
          limit-severities-for-sarif: true
          # Bloqueante en HIGH/CRITICAL (verificado 2026-06-22: 0 alertas
          # Trivy HIGH/CRITICAL abiertas en code-scanning → no rompe CI hoy;
          # bloquea regresiones futuras). El upload de SARIF abajo mantiene
          # if:always() → el reporte sube igual aunque el gate falle.
          exit-code: '1'
          ignore-unfixed: true
      - name: Trivy config scan (Dockerfiles + Terraform)
        # Sin limit-severities-for-sarif: este step es report-only (exit-code
        # '0', nunca gatea) y el config scan de IaC quiere visibilidad amplia de
        # misconfigs en el Security tab para triage aparte (ver comentario abajo).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          # report-only (exit 0): el config scan de IaC (Dockerfiles/Terraform)
          # tiene misconfigs HIGH/CRITICAL preexistentes que requieren triage
          # aparte. Bloquearlo rompería main hoy. El SARIF sube igual a
          # code-scanning (abajo). Volver a '1' cuando los misconfigs se saldan.
          exit-code: '0'
      - name: Upload Trivy filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Upload Trivy config SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ---------------------------------------------------------------------------
  # Impersonación auditada (#584) — wire-completeness del guard de escritura.
  # Parsea server.ts + verifica que CADA mount point con firebaseAuthMiddleware
  # también tiene impersonationWriteGuardMiddleware en el chain. Un gap ahí
  # sería una ruta mutante por la que una sesión impersonada podría escribir
  # sobre una empresa real sin bloqueo. Reusa el mismo script que ya corre como
  # test vitest en el job `test` (apps/api/scripts/check-impersonation-wire-
  # completeness.ts) — acá es el gate de SEGURIDAD dedicado y visible.
  # ---------------------------------------------------------------------------
  impersonation-wire-completeness:
    name: Impersonation write-guard completeness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: '10.34.4'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify every auth-required mount point has impersonationWriteGuardMiddleware wired
        run: pnpm --filter @booster-ai/api exec tsx scripts/check-impersonation-wire-completeness.ts

  # ---------------------------------------------------------------------------
  # SEC-001 boundary-closure T2 (SC-G1b) — harness CI default-deny.
  # Spec .specs/sec-001-h1-2-google-boundary-closure/spec.md SC-G1b + T15;
  # ADR-057 (supersede ADR-054). Enumera CADA mount de server.ts (app.route()
  # + sub-mounts <router>.route(), que el parser de app.use NO ve)
  # y falla el build si aparece un factory/router sin clasificar en
  # ROUTE_CLASSIFICATION. Reemplaza el backstop creation-time (blocking
  # function) por una invariante de wiring durable.
  # ---------------------------------------------------------------------------
  route-default-deny:
    name: route default-deny harness (SC-G1b T15)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: '10.34.4'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify every server.ts route mount is classified (default-deny)
        run: pnpm --filter @booster-ai/api exec tsx scripts/check-route-default-deny.ts

  # ---------------------------------------------------------------------------
  # SBOM generation — Software Bill of Materials para auditoría
  # ---------------------------------------------------------------------------
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: '10.34.4'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate CycloneDX SBOM
        # cdxgen es pnpm-workspace aware (cyclonedx-npm rompía con workspace:* protocol)
        run: npx -y @cyclonedx/cdxgen@latest --type pnpm --output sbom.cyclonedx.json --spec-version 1.5
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 90
