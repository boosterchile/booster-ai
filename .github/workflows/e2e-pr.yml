name: E2E PR (local)

# Check E2E de PR que levanta el dev server de apps/web LOCALMENTE (sin tocar
# prod/staging) y corre Playwright/Chromium contra `/apariencia`. Verifica
# cascada CSS computada y foco reales, que jsdom no puede (p.ej. blindaje #576).
#
# Distinto de `e2e-staging.yml` (nightly + on-demand contra PROD, 4 browsers, se
# salta en PRs a propósito): éste corre en CADA PR a main.
#
# Branch protection: el job `e2e-conductor` SIEMPRE publica el check
# `E2E conductor (Auth emulator + API local)` en PRs a main (sin path
# filter a nivel workflow). Un job skipped NO satisface required checks;
# por eso este job corre siempre y hace `exit 0` en skip documentado.
# El Playwright pesado vive en `e2e-conductor-run` (Postgres/Redis/Auth)
# y solo arranca si el diff toca superficie E2E — barato en minutos CI.
# Listo para marcarse required; el setting lo aplica ops humana de GitHub.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.34.4'

jobs:
  e2e-paths:
    name: E2E path filter
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      local: ${{ steps.filter.outputs.local }}
      conductor: ${{ steps.filter.outputs.conductor }}
    steps:
      - uses: actions/checkout@v4
      - name: Detectar paths E2E
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            local:
              - 'apps/web/**'
              - 'packages/ui-components/**'
              - 'packages/ui-tokens/**'
              - '.github/workflows/e2e-pr.yml'
            conductor:
              - 'apps/web/**'
              - 'apps/api/scripts/seed-conductor-e2e.ts'
              - 'apps/api/scripts/seed-conductor-e2e-cleanup.ts'
              - 'apps/api/test/scripts/seed-conductor-e2e-cleanup.test.ts'
              - 'apps/api/src/services/firebase.ts'
              - 'packages/ui-components/**'
              - 'packages/ui-tokens/**'
              - '.github/workflows/e2e-pr.yml'
              - 'firebase.json'
              - '.firebaserc'
              - '.specs/conductor-e2e-auth-emulator/**'

  e2e-local:
    name: E2E local (Chromium) — /apariencia
    needs: e2e-paths
    if: needs.e2e-paths.outputs.local == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `.env.local` está gitignoreado (ausente en CI). Sin las VITE_*, el schema
      # de `env.ts` lanza en el boot y la app queda en blanco. `/apariencia` es
      # pública (no llama a Firebase), así que los placeholders del example
      # satisfacen el schema y la app monta.
      - name: Provide public env (placeholders del example)
        run: cp apps/web/.env.example apps/web/.env
      # Solo Chromium (pin implícito a @playwright/test del lockfile). Sin webkit
      # ni firefox: los descartamos a propósito (webkit colgaba el nightly).
      - name: Install Playwright Chromium
        run: pnpm --filter @booster-ai/web exec playwright install --with-deps chromium
      - name: Run E2E local (build + preview + Chromium)
        run: pnpm --filter @booster-ai/web test:e2e:local
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-local-report
          path: |
            apps/web/playwright-report-local/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Playwright pesado: solo si el diff toca superficie E2E conductor.
  # El check required NO es este job (un skip lo dejaría "Skipped" y
  # bloquearía el merge). Ver `e2e-conductor` abajo.
  e2e-conductor-run:
    name: E2E conductor Playwright
    needs: e2e-paths
    if: needs.e2e-paths.outputs.conductor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: development
      PORT: '8080'
      SERVICE_NAME: booster-ai-api
      SERVICE_VERSION: 0.0.0-e2e
      LOG_LEVEL: warn
      GOOGLE_CLOUD_PROJECT: booster-ai-dev
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      REDIS_TLS: 'false'
      FIREBASE_PROJECT_ID: booster-ai-dev
      FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:9099'
      JWT_ISSUER: booster-ai
      API_AUDIENCE: https://api.boosterchile.com
      ALLOWED_CALLER_SA: e2e-api@booster-ai-dev.iam.gserviceaccount.com
      OBSERVABILITY_DASHBOARD_ACTIVATED: 'false'
      AUTH_UNIVERSAL_V1_ACTIVATED: 'true'
      STRICT_MIGRATION_ORDERING: 'true'
      VITE_USE_AUTH_EMULATOR: 'true'
      VITE_AUTH_EMULATOR_URL: http://127.0.0.1:9099
      VITE_API_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Enable pgcrypto
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          PGPASSWORD=test psql -h localhost -U test -d test -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'
      - name: Start Auth emulator :9099
        run: |
          nohup npx --yes firebase-tools@14.7.0 emulators:start --only auth --project booster-ai-dev --non-interactive > /tmp/auth-emulator.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -s http://127.0.0.1:9099 >/dev/null 2>&1; then
              echo "Auth emulator listo"
              exit 0
            fi
            sleep 2
          done
          echo "Auth emulator no levantó en :9099" >&2
          tail -n 80 /tmp/auth-emulator.log >&2 || true
          exit 1
      - name: Provide web env (placeholders + Auth emulator)
        run: |
          cp apps/web/.env.example apps/web/.env
          {
            echo 'VITE_USE_AUTH_EMULATOR=true'
            echo 'VITE_AUTH_EMULATOR_URL=http://127.0.0.1:9099'
            echo 'VITE_API_URL=http://localhost:8080'
          } >> apps/web/.env
      - name: Start API :8080
        working-directory: apps/api
        run: |
          nohup pnpm exec tsx src/main.ts > /tmp/api-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "API lista"
              exit 0
            fi
            sleep 2
          done
          echo "API no levantó en :8080" >&2
          tail -n 120 /tmp/api-e2e.log >&2 || true
          exit 1
      - name: Install Playwright Chromium
        run: pnpm --filter @booster-ai/web exec playwright install --with-deps chromium
      - name: Run E2E conductor
        run: pnpm --filter @booster-ai/web test:e2e:conductor
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-conductor-report
          path: |
            apps/web/playwright-report-conductor/
            apps/web/test-results/
            /tmp/auth-emulator.log
            /tmp/api-e2e.log
          retention-days: 14
          if-no-files-found: ignore

  # Check estable para branch protection. Nombre EXACTO del job verde de #693.
  # Corre siempre (no `if:` de skip). `always()` es necesario para que no se
  # skippee cuando `e2e-conductor-run` no corre.
  e2e-conductor:
    name: E2E conductor (Auth emulator + API local)
    needs: [e2e-paths, e2e-conductor-run]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Skip documentado o propagar resultado
        run: |
          set -euo pipefail
          paths_result='${{ needs.e2e-paths.result }}'
          conductor='${{ needs.e2e-paths.outputs.conductor }}'
          run_result='${{ needs.e2e-conductor-run.result }}'
          if [ "$paths_result" != 'success' ]; then
            echo "E2E path filter falló (result=$paths_result)." >&2
            exit 1
          fi
          if [ "$conductor" != 'true' ]; then
            echo "Skip documentado: el diff no toca superficie E2E conductor."
            echo "El check 'E2E conductor (Auth emulator + API local)' se reporta verde"
            echo "para poder marcarse required en branch protection (ops humana de GitHub)."
            echo "Paths que disparan el Playwright: apps/web, seed T2, firebase API/emulator, UI tokens/components, este workflow, spec conductor-e2e-auth-emulator."
            exit 0
          fi
          echo "e2e-conductor-run result=$run_result"
          if [ "$run_result" = 'success' ]; then
            exit 0
          fi
          echo "E2E conductor Playwright no pasó (result=$run_result). Ver el job 'E2E conductor Playwright'." >&2
          exit 1
