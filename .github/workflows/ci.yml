name: CI

# Ejecutado en cada push a cualquier branch y en cada PR hacia main.
# Gates bloqueantes: lint (Biome), typecheck (tsc), tests (Vitest) con coverage ≥80%, build.
# Ver docs/adr/001-stack-selection.md y CLAUDE.md principio 1 (zero tech debt).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.34.4'
  # Coverage mínimo bloqueante: 80 en las cuatro métricas para cada
  # workspace (T10-08, ADR-082).
  COVERAGE_MIN_LINES: 80
  COVERAGE_MIN_BRANCHES: 80
  COVERAGE_MIN_FUNCTIONS: 80
  COVERAGE_MIN_STATEMENTS: 80

jobs:
  # ---------------------------------------------------------------------------
  # Setup — instala deps una vez, reusa en jobs subsiguientes via cache
  # ---------------------------------------------------------------------------
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

  # ---------------------------------------------------------------------------
  # Lint — Biome (strict, bloqueante)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Biome)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Format check
        run: pnpm format:check

  # ---------------------------------------------------------------------------
  # Terraform fmt — gate que faltaba: el drift de alineación de #449
  # (storage.tf) llegó a main porque ningún check de CI corría `fmt -check`.
  # No necesita GCP/WIF (es puro formateo), corre en cada PR. El drift de
  # ESTADO real (plan) lo cubre terraform-drift.yml (cron + WIF) por separado.
  # ---------------------------------------------------------------------------
  terraform-fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -check -recursive infrastructure/

  # ---------------------------------------------------------------------------
  # Typecheck — tsc --noEmit por workspace (Turborepo paraleliza)
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck (tsc)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ---------------------------------------------------------------------------
  # Test + Coverage Gate (≥80% bloqueante)
  # ---------------------------------------------------------------------------
  test:
    name: Test + Coverage (≥80%)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        run: pnpm test:coverage
      - name: Check coverage thresholds
        run: |
          # Busca todos los coverage-summary.json y valida umbrales.
          # Vitest emite uno por workspace en coverage/coverage-summary.json.
          fail=0
          for f in $(find . -name coverage-summary.json -not -path './node_modules/*'); do
            echo "Checking $f"
            node -e "
              const r = require('./$f').total;
              const min = { lines: ${{ env.COVERAGE_MIN_LINES }}, branches: ${{ env.COVERAGE_MIN_BRANCHES }}, functions: ${{ env.COVERAGE_MIN_FUNCTIONS }}, statements: ${{ env.COVERAGE_MIN_STATEMENTS }} };
              let ok = true;
              for (const key of Object.keys(min)) {
                // 'Unknown' (cero archivos medidos) no es un número: falla el gate.
                const pct = typeof r[key]?.pct === 'number' ? r[key].pct : 0;
                const status = pct >= min[key] ? '✓' : '✗';
                console.log(\`  \${status} \${key}: \${pct}% (min \${min[key]}%)\`);
                if (pct < min[key]) ok = false;
              }
              process.exit(ok ? 0 : 1);
            " || fail=1
          done
          if [ $fail -eq 1 ]; then
            echo ""
            echo "::error::Coverage thresholds not met. Add tests or justify in PR."
            exit 1
          fi
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: '**/coverage/**'
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Integration tests — DB (postgres) + Redis services
  # Sprint 2a T0 (sec-001-cierre): habilita CI gating para *.integration.test.ts
  # files que vitest.config.ts:9 excluye del default test run.
  # Vitest globalSetup (apps/api/test/integration/setup-global.ts) corre las
  # migrations inline contra TEST_DATABASE_URL antes del primer test.
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration tests (DB + Redis)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Espejo de Google: Docker Hub limita los pulls anónimos de los runners.
        image: mirror.gcr.io/library/postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      # Deshabilita ryuk (el reaper de testcontainers): su imagen
      # testcontainers/ryuk:0.14.0 flakea al pullear de Docker Hub (404
      # intermitente que tumbaba el job entero — rompió CI en #618 y #622,
      # ajeno al cambio bajo prueba). En este runner ubuntu-latest EFÍMERO el
      # cleanup de ryuk es redundante: la VM (con su Docker daemon y todos los
      # contenedores) se destruye al terminar el job, así que no quedan
      # huérfanos que reapear. Los 4 suites que usan testcontainers
      # (safety-events, redis-fail-closed-real, signup-request[-fail-closed])
      # levantan su Redis igual, solo sin el sidecar reaper. Si el job migrara a
      # un runner self-hosted/persistente, reevaluar (ahí ryuk sí limpia).
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      # Testcontainers (Redis real en los tests) también desde el espejo de
      # Google: sin esto baja redis:7-alpine de Docker Hub dentro del test.
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm --filter @booster-ai/api test:integration

  # ---------------------------------------------------------------------------
  # Migration safety (audit P1-H, ADR-066) — bloquea migraciones Drizzle nuevas
  # con DDL destructivo (rompe expand/contract → rollback de código deja de ser
  # seguro) salvo que declaren `-- contract-phase: <ref>`. Solo chequea los .sql
  # AÑADIDOS en el PR, nunca las migraciones ya aplicadas. No necesita deps.
  # ---------------------------------------------------------------------------
  migration-safety:
    name: Migration safety (expand/contract)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Unit test del guard
        run: node --test scripts/repo-checks/check-migration-safety.test.mjs
      - name: Guard sobre migraciones añadidas en el PR
        if: github.event_name == 'pull_request'
        run: |
          BASE='${{ github.event.pull_request.base.sha }}'
          ADDED=$(git diff --name-only --diff-filter=A "$BASE" HEAD -- apps/api/drizzle \
            | grep -E '^apps/api/drizzle/[0-9]{4}_.*\.sql$' || true)
          if [ -z "$ADDED" ]; then
            echo "Sin migraciones nuevas en este PR — nada que chequear."
            exit 0
          fi
          echo "Migraciones nuevas:"; echo "$ADDED"
          # shellcheck disable=SC2086
          node scripts/repo-checks/check-migration-safety.mjs $ADDED

  # ---------------------------------------------------------------------------
  # Build — cada app y package compila a producción
  # ---------------------------------------------------------------------------
  build:
    name: Build
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            apps/*/dist/**
            packages/*/dist/**
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Docker build + smoke del api — gate que faltaba (2026-06-22).
  #
  # El job `build` de arriba corre `pnpm build` con node_modules COMPLETO, así
  # que tsup/esbuild resuelve todo y pasa. Pero el Dockerfile del api hace un
  # `pnpm install` PARCIAL (solo los package.json COPY'd en el deps-stage) y
  # luego `pnpm deploy --prod` para el runtime. Un cambio que rompe ese build/
  # runtime del contenedor pasaba CI verde y solo fallaba en el deploy a prod.
  # Causó 2 deploys de producción fallidos seguidos:
  #   1. Build: esbuild "Could not resolve" (deps de un workspace package
  #      bundleado que no estaban en el COPY del deps-stage). Fix PR #540.
  #   2. Runtime: ERR_MODULE_NOT_FOUND al startup (esas deps no eran deps
  #      DIRECTAS del api → pnpm deploy --prod no las metía). Fix PR #541.
  # Este job reproduce el build real del contenedor (cacha #1) y verifica que
  # los imports resuelven en el runtime (cacha #2). Patrón completo en la
  # memoria api-bundled-pkg-runtime-deps-2026-06. Extensible a las otras apps
  # con Dockerfile (web, whatsapp-bot, telemetry-*) vía matrix — follow-up.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build + smoke (api)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # BuildKit y las imágenes base (FROM node:24-*) se bajan del espejo de
      # Google: Docker Hub limita los pulls anónimos de los runners y falla con
      # toomanyrequests o timeout antes de compilar.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build imagen del api (reproduce el build de prod, install parcial)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: booster-ai-api:ci
          load: true
          cache-from: type=gha,scope=docker-api
          cache-to: type=gha,mode=max,scope=docker-api
      - name: Smoke — los imports resuelven en el runtime (cacha ERR_MODULE_NOT_FOUND)
        run: |
          # Corre el entrypoint REAL del contenedor. El api hace process.exit(1)
          # por env/config faltante (esperado en CI, sin env seteado) — eso NO
          # importa. Lo que importa: si una dep externa de un workspace package
          # bundleado falta en el flat node_modules del runtime, Node tira
          # ERR_MODULE_NOT_FOUND al resolver el grafo de módulos ANTES de que
          # corra el config. Por eso ignoramos el exit code (el config-exit lo
          # dispara) y grepeamos la salida por esa firma exacta.
          docker run --rm booster-ai-api:ci \
            node --import ./dist/instrumentation.js dist/main.js > /tmp/api-boot.log 2>&1 || true
          echo "--- salida del arranque del contenedor ---"
          cat /tmp/api-boot.log
          echo "------------------------------------------"
          if grep -q "ERR_MODULE_NOT_FOUND" /tmp/api-boot.log; then
            echo "::error::Falta una dep en el runtime del contenedor (ERR_MODULE_NOT_FOUND) — ver memoria api-bundled-pkg-runtime-deps"
            exit 1
          fi
          echo "✓ Sin ERR_MODULE_NOT_FOUND — los módulos resuelven en runtime (el exit por config/env sin setear es esperado)"

  # ---------------------------------------------------------------------------
  # Docker build + startup probe de notification-service y matching-engine.
  #
  # El job del api (arriba) no llega a escuchar: sale por config. Estos dos
  # sí tienen que responder GET /health, que es el startup probe de Cloud Run
  # (infrastructure/modules/cloud-run-service). En prod el dist ESM bundleaba
  # el exporter CJS de Cloud Monitoring y el proceso moría al cargar
  # instrumentation.js con `Dynamic require of "child_process" is not
  # supported`, antes de abrir el puerto. `pnpm build` en el job `build` no
  # lo ve: usa el node_modules completo y no arranca la imagen.
  # ---------------------------------------------------------------------------
  docker-startup:
    name: Docker startup (${{ matrix.service }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [notification-service, matching-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build imagen (mismo Dockerfile que prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          tags: booster-ai-${{ matrix.service }}:ci
          load: true
          cache-from: type=gha,scope=docker-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.service }}
      - name: Arrancar y verificar GET /health
        run: |
          set -euo pipefail
          name="${{ matrix.service }}"
          cid="smoke-${name}"
          docker rm -f "$cid" >/dev/null 2>&1 || true
          args=(
            -d --name "$cid" -p 8080:8080
            -e PORT=8080
            -e NODE_ENV=production
            -e GOOGLE_CLOUD_PROJECT=booster-ai-494222
          )
          case "$name" in
            notification-service)
              args+=(
                -e TWILIO_ACCOUNT_SID=ACdeadbeef
                -e TWILIO_AUTH_TOKEN=ci-smoke-token
                -e TWILIO_FROM_NUMBER=+15555550100
              )
              ;;
            matching-engine)
              args+=(
                -e OIDC_AUDIENCE=https://matching-engine.example.run.app
                -e ALLOWED_CALLER_SA=api@booster-ai-494222.iam.gserviceaccount.com
              )
              ;;
            *)
              echo "::error::servicio sin env de smoke: $name"
              exit 1
              ;;
          esac
          cleanup() {
            echo "--- logs de ${cid} ---"
            docker logs "$cid" || true
            echo "-----------------------"
            docker rm -f "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run "${args[@]}" "booster-ai-${name}:ci"
          ok=0
          for _ in $(seq 1 30); do
            code="$(curl -s -o /tmp/health-body -w '%{http_code}' --max-time 2 http://127.0.0.1:8080/health || true)"
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            running="$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null || echo false)"
            if [ "$running" != "true" ]; then
              echo "::error::${name} murió antes de responder /health"
              exit 1
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::${name} no respondió 200 en GET /health (startup probe)"
            exit 1
          fi
          if ! grep -q '"status":"ok"' /tmp/health-body; then
            echo "::error::${name} /health no trae status ok: $(cat /tmp/health-body)"
            exit 1
          fi
          if docker logs "$cid" 2>&1 | grep -E 'Dynamic require of|ERR_MODULE_NOT_FOUND'; then
            echo "::error::${name} arrancó con un fallo de bundle o de módulos"
            exit 1
          fi
          echo "✓ ${name} GET /health → 200 $(cat /tmp/health-body)"

  # ---------------------------------------------------------------------------
  # Final gate — todos los jobs previos deben pasar
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI Success
    needs: [lint, terraform-fmt, typecheck, test, integration-tests, migration-safety, build, docker-build, docker-startup]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.terraform-fmt.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.migration-safety.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ] || \
             [ "${{ needs.docker-startup.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "✓ All CI jobs passed"
